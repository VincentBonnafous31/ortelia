# Checks every change on Linux and Windows, then builds the binaries of both systems.
# The Windows version is built nowhere else (on the development machine, cargo only runs in WSL2).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push on a pull request cancels the run that became obsolete. Runs on main are never
# cancelled: each commit of main must get its binaries.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Smaller debug info for the dev and test builds: a smaller cache and faster links (the
  # wgpu/eframe stack is large), while backtraces keep their file and line numbers.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # tools/check.sh runs the same checks locally: keep both in step.
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      # Show the result of both systems even if one fails.
      fail-fast: false
      matrix:
        # The Linux image is fixed: the snapshot references are made in WSL2 with the Mesa of
        # Ubuntu 26.04 (docs/essais/captures-images.md). Moving to another Ubuntu is a decision:
        # same version in WSL2, then new references.
        os: [ubuntu-26.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install

      # Only main saves the cache, so that pull requests do not fill the 10 GB per repository.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The result does not depend on the system.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Software rendering: lavapipe (Vulkan) renders the snapshot tests, and with Xvfb and Mesa
      # (OpenGL) the smoke test draws in a virtual screen. winit loads libxkbcommon-x11 at run
      # time under X11 and panics without it.
      - name: Install the software rendering packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri libegl1 libxkbcommon-x11-0

      # On Linux, the tests include the snapshot tests; on Windows they are listed as ignored.
      - name: Tests
        run: cargo test --workspace --locked

      # A failed snapshot writes <name>.new.png and <name>.diff.png next to its reference: kept
      # for 30 days, to look at them without running the tests again
      # (`gh run download <id> -n snapshots-linux`).
      - name: Images of the failed snapshots
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-linux
          path: |
            crates/*/tests/snapshots/**/*.new.png
            crates/*/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Layer rule
        run: cargo xtask check-layers

      # The schemas of schemas/ are generated from the code: they are the same on every system.
      - name: JSON Schemas up to date
        if: runner.os == 'Linux'
        run: cargo xtask gen-schemas --check

      - name: Smoke test (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p ortelia --locked --test smoke -- --ignored

      # Windows runners have a desktop session but no GPU: wgpu should fall back to WARP
      # (Direct3D 12 software rendering), which is still to be confirmed. Not blocking: a
      # failure stays visible in the run details without failing the run.
      - name: Smoke test (Windows, not blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo test -p ortelia --locked --test smoke -- --ignored

  # Test coverage of each crate, measured by cargo-llvm-cov (LLVM source-based coverage), shown
  # in the summary of the run and kept as an HTML report (detail by file and line). Linux only,
  # and not blocking for the other jobs: no threshold yet, the figure is only for reading.
  coverage:
    # Same image as the Linux checks: the tests include the snapshot tests.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # llvm-tools: the llvm-profdata and llvm-cov of the toolchain, which cargo-llvm-cov calls.
      - name: Install the Rust toolchain of rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup component add llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@cargo-llvm-cov

      # lavapipe, the Vulkan software renderer of the snapshot tests.
      - name: Install the software rendering packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      # The tests run once (instrumented build in target/llvm-cov-target); both reports are
      # then made from the same profile data.
      - name: Tests with coverage
        run: cargo llvm-cov --workspace --locked --no-report

      - name: Coverage by crate
        run: |
          cargo llvm-cov report --json --summary-only --output-path target/coverage.json
          cargo xtask coverage target/coverage.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: HTML report
        run: cargo llvm-cov report --html

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/llvm-cov/html
          if-no-files-found: error
          retention-days: 30

  binaries:
    name: binaries (${{ matrix.os }})
    needs: checks
    # Pull requests do not produce binaries.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ortelia-linux-x86_64
            exe: target/release/ortelia
          - os: windows-latest
            artifact: ortelia-windows-x86_64
            exe: target/release/ortelia.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --release --locked -p ortelia

      # A binary that does not start fails the job before its upload.
      - name: Check that the binary starts
        shell: bash
        run: ./${{ matrix.exe }} --version

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 30
