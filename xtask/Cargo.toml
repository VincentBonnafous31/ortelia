[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cargo_metadata.workspace = true
fastrand.workspace = true
serde_json.workspace = true
# A tool may depend on the layer crates (the reverse is forbidden). `gen-schemas` reads the types
# of the configuration files, with their JSON Schema feature.
ortelia-config = { workspace = true, features = ["json-schema"] }
ortelia-model = { workspace = true, features = ["json-schema"] }
schemars.workspace = true

# The test that loads a generated file with the test model.
[dev-dependencies]
ortelia-service.workspace = true
tempfile.workspace = true

[lints]
workspace = true
