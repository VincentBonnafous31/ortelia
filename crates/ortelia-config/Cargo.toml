[package]
name = "ortelia-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ortelia-model.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }

# The JSON Schema of `app.json`, generated by `cargo xtask gen-schemas`: only `xtask` enables it,
# so that the application is built without schemars.
[features]
json-schema = ["dep:schemars", "ortelia-model/json-schema"]

[lints]
workspace = true
